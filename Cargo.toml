[package]
name = "rust-drive"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "0.8.1"
gpui-navigator = { version = "0.2.1", default-features = false, features = [
    "gpui-pre",
    "transition",
    "guard",
    "middleware",
    "cache",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "sync",
    "fs",
    "macros",
    "time",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.13"

[profile.dev]
opt-level = 0              # Keep your code unoptimized for instant compilation
debug = "line-tables-only" # Reduces massive debug binary overhead

[profile.dev.package."*"]
opt-level = 3 # Heavily optimize external dependencies
